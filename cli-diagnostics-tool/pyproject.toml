
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "envdoctor-cli"
version = "1.0.0"
description = "A command-line tool for checking developer environment health"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
envdoctor = "envdoctor.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
